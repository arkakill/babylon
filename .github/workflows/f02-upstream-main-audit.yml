name: F-02 upstream main differential audit

on:
  push:
    branches:
      - audit/f02-upstream-main-c2f731f

permissions:
  contents: read

jobs:
  f02-upstream-main:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go from go.mod
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Record source and toolchain
        shell: bash
        run: |
          mkdir -p audit-results
          printf '%s\n' "$(git rev-parse HEAD)" > audit-results/audit-commit.sha
          printf '%s\n' "$(git merge-base HEAD c2f731f4531b2b22afe5047f152e108b944bf811)" > audit-results/upstream-base.sha
          printf '%s\n' "$(git status --short --branch)" > audit-results/git-status.txt
          printf '%s\n' "$(git diff --name-only c2f731f4531b2b22afe5047f152e108b944bf811 HEAD)" > audit-results/audit-commit-files.txt
          go version | tee audit-results/go-version.txt
          go env GOVERSION GOTOOLCHAIN GOOS GOARCH CGO_ENABLED | tee audit-results/go-env.txt
      - name: Run control test
        id: control
        shell: bash
        run: |
          command="go test -mod=readonly -tags='cgo ledger test_ledger_mock norace' -count=1 -v -run '^TestF02ControlQuorumBeforeExpiry$' ./x/finality/keeper"
          printf '%s\n' "$command" > audit-results/control-command.txt
          set +e
          go test -mod=readonly -tags='cgo ledger test_ledger_mock norace' -count=1 -v -run '^TestF02ControlQuorumBeforeExpiry$' ./x/finality/keeper > audit-results/control.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > audit-results/control.exit-code
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
          cat audit-results/control.log
      - name: Run late-quorum target test
        if: steps.control.outputs.exit_code == '0'
        shell: bash
        run: |
          command="go test -mod=readonly -tags='cgo ledger test_ledger_mock norace' -count=1 -v -run '^TestF02LateQuorumAfterExpiryHasNoVotingPower$' ./x/finality/keeper"
          printf '%s\n' "$command" > audit-results/target-command.txt
          set +e
          go test -mod=readonly -tags='cgo ledger test_ledger_mock norace' -count=1 -v -run '^TestF02LateQuorumAfterExpiryHasNoVotingPower$' ./x/finality/keeper > audit-results/target.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > audit-results/target.exit-code
          cat audit-results/target.log
      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          control_result="$(cat audit-results/control.exit-code 2>/dev/null || echo not-run)"
          target_result="$(cat audit-results/target.exit-code 2>/dev/null || echo not-run)"
          upstream_sha="$(cat audit-results/upstream-base.sha 2>/dev/null || echo unavailable)"
          {
            echo "## F-02 upstream main differential audit"
            echo
            echo "- Upstream base SHA: $upstream_sha"
            echo "- Audit commit: $GITHUB_SHA"
            echo "- Control exit code: $control_result"
            echo "- Target exit code: $target_result"
            echo "- Full logs, exact commands, toolchain, and codes are attached as workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$control_result" != "0" || "$target_result" != "0" ]]; then
            exit 1
          fi
      - name: Preserve test logs and metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: f02-main-c2f731f-audit-results
          path: audit-results/
          if-no-files-found: warn
          retention-days: 90
